name: one-time unit repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit-audit-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair numeric-ma contamination
        shell: python
