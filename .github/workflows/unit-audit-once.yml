              ('“有一百七码。”', '“有一百零七页。”'),
              ('八码多条窄街', '八九条窄街'),
              ('沿台阶扛上七码高度', '沿台阶扛上几十米高差'),
              ('岬灯七码街区', '岬灯七号街区'),
              ('八码长的密封带', '八米长的密封带'),
              ('本周修补八码件，成衣三件', '本周修补八件，成衣三件'),
              ('含上楼七码以内搬运', '含七层以内搬运'),
              ('很多工坊前面只有六码宽', '很多工坊前面只有六米宽'),
              ('预计十到十七码后到', '预计十到十七天后到'),
              ('你已经检查七码了', '你已经检查七遍了'),
              ('没有七码。', '没有七遍。'),
              ('数到七码以后', '数到七以后'),
              ('看见八码、七码、旧商埠', '看见第八码头、第七码头、旧商埠'),
              ('桌上摆了七码张票价表', '桌上摆了七张票价表'),
              ('第三日六时四十七码', '第三日六时四十七分'),
              ('十七码分钟转车', '十七分钟转车'),
              ('分散在七码个包里', '分散在七个包里'),
              ('买了七码只不同馅的小烤饼', '买了七只不同馅的小烤饼'),
              ('弥珞那个七码烤饼方案', '弥珞那个七只小烤饼方案'),
              ('六时四十七码', '六时四十七分'),
              ('晚了七码钟', '晚了七分钟'),
              ('慢了七码钟', '慢了七分钟'),
              ('停留七码', '停留七天'),
              ('门内三码左右', '门内三米左右'),
              ('七码分钟后', '七分钟后'),
              ('晚七码钟回灰岭', '晚七分钟回灰岭'),
          ]

          # Rules/examples are rewritten after the corpus repair so the audit itself does not
          # keep reproducing the malformed tokens it is supposed to eliminate.
          units_text = '''# 计量、时间与编号规范

本文件是《弥珞没有返程日期》的正典编辑规范之一。它规定正文面向读者的转写方式，不要求世界内部各地区在历史上真实使用完全相同的单位。

## 现代通用计量

现代日常、工程、铁路、测绘、医疗和公共设施默认使用读者熟悉的公制等值转写：毫米、厘米、米、公里，以及平方米、立方米、升、毫升等必要单位。人体身高优先使用厘米或米，工程距离使用米或公里，精细零件使用毫米或厘米。

这是一种叙事转写约定，不宣称异世界历史上发明过现实世界的 SI 制。

## 数字后误插“码”的历史污染

早期与中后期稿件曾出现一种系统性编辑污染：把“码”无意义地附着在数字后，导致同一字样被错误用于站序、数量、钟表时间、设施编号和物理长度。由于这些用法彼此不存在统一换算关系，已经确认它们不属于世界观单位。

全库修订后，正文应恢复各自正常写法：站序使用“第五站、第七站”一类序数；线路和设备使用“七号线、七号样机”等编号；数量使用本、张、只、个、人等合适量词；钟表时间明确写“分”；物理尺寸明确写厘米、米、公里等。

只有“码头、号码、编码、密码”等汉语本来包含“码”的词正常保留。“两码事”之类固定汉语表达也不属于计量单位。

## 长度与尺度

物理量必须按场景核定，不能因为旧稿中数字相同就假定尺度相同。王冠饰件可以是厘米级，港岸测量可以是米级，城市或铁路距离则可能是公里级。若上下文不足，宁可写“几米、几十米、约一段街宽”，也不要为了异世界感临时发明单位。

## 编号

- 铁路普通站序：第五站、第六站、第七站；
- 正式线路、车辆、设备或分区：七号线、七号样机、八号区等；
- 码头作为正常汉语名词，可写第一码头、第二码头、第七码头、第八码头，并在同一港区保持命名风格清楚；
- 机构名中的数字采用“号”或自然序数，不使用无定义后缀。

## 时间

现代精密时间使用正常汉语钟表表达，例如十八点零七分、六时四十七分。文学叙述中的“几息”可以作为主观短时感受保留，但不是与钟表精密互换的正式单位。

## 身体感与地方旧单位

“半指宽、一臂远、几步、走一会儿”等可用于人物即时估计和感官描写，不作为工程标准。古代文献、地方行业或外国地区若未来确实需要本地旧单位，必须对剧情或地方史有意义，并在首次出现时通过换算或场景建立尺度，明确其时代与地域归属。

## 后续写作硬规则

新正文不得把“码”当作万能数值后缀。写出数字后必须判断它表示序号、时间、数量还是物理量；工程数字优先给实际单位，历史单位没有叙事必要时不为异世界感而造。
'''

          audit_text = '''# 计量与编号全库审校记录

## 结论

本轮全库审校确认：此前数字后异常出现的“码”不是异世界单位，而是文本生成与编辑污染。它曾误入站序、时间、数量、设施名和长度等互不兼容的位置，现已按上下文逐项恢复。

## 已完成修订

- 铁路站序恢复为正常序数写法；
- 钟表时间恢复“时/点 + 分”；
- 书本、人数、表格、食品、包件等恢复合适量词；
- 公共交通、设备、分区与机构编号统一为“号”或自然序数；
- 王冠饰件、港岸水尺、岸线教学段、店面、搬运高度等物理尺寸按场景恢复为厘米、米、层数或自然尺度表达；
- 塔温港相关专名统一：公共环线采用七号编号，外港客船采用“海门七号”，剧场与装卸区采用六号编号；
- 地方小册统一命名为《塔温港异闻十七则》；
- 第190章“四十七本书”相关叙事及标题统一；
- 汇编稿 MANUSCRIPT.md 同步修订，不只修改分章文件。

## 合法保留

正常汉语词中的“码”不受影响，包括码头、号码、编码、密码，以及“两码事”等固定表达。第七码头、第八码头等结构中的“码”属于“码头”一词，也正常保留。

## 防回归

正典规则见 `canon/units.md`。今后新章默认使用公制等值转写和正常编号；若确实引入地方旧单位，必须有明确叙事意义和尺度说明。
'''

          style_bad = '- 不得再用`第五码站、四十七码书、二十七码人、六时四十七码、八码桌`这类“码”占位写法。'
          style_good = '- 不得把数字后无意义地附加“码”来代替站序、量词、钟表时间、编号或物理单位；每个数字都必须按语义使用正常写法。'
          style_rhyme_bad = '“七码有灯，八码有声”'
          style_rhyme_good = '“第七码头有灯，第八码头有声”'

          paths = [p for p in Path('.').rglob('*.md') if '.git' not in p.parts]
          changed = []
          for p in paths:
              text = p.read_text(encoding='utf-8')
              old = text
              for a, b in replacements:
                  text = text.replace(a, b)
              text = text.replace(style_bad, style_good).replace(style_rhyme_bad, style_rhyme_good)
              if p.as_posix() == 'canon/units.md':
                  text = units_text
              elif p.as_posix() == 'notes/unit-audit.md':
                  text = audit_text
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          old_name = Path('chapters/190-我们说只是去旧书廊看看，最后给灰岭寄回去了四十七码书.md')
          new_name = Path('chapters/190-我们说只是去旧书廊看看，最后给灰岭寄回去了四十七本书.md')
          if old_name.exists():
              old_name.rename(new_name)
              changed.append(f'{old_name} -> {new_name}')

          # Replace any textual path reference to the renamed chapter.
          old_path = old_name.as_posix()
          new_path = new_name.as_posix()
          for p in [p for p in Path('.').rglob('*.md') if '.git' not in p.parts]:
              text = p.read_text(encoding='utf-8')
              if old_path in text:
                  p.write_text(text.replace(old_path, new_path), encoding='utf-8')
                  if str(p) not in changed:
                      changed.append(str(p))

          print('CHANGED_FILES')
          for p in changed:
              print(p)

          # Final strict scan. Normal words ending in 码头 and the idiom 两码事 are allowed.
          pat = re.compile(r'[零〇一二三四五六七八九十百千万两0-9点\.]+码')
          leftovers = []
          for p in [p for p in Path('.').rglob('*.md') if '.git' not in p.parts]:
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  for m in pat.finditer(line):
                      if line[m.end():m.end()+1] == '头':
                          continue
                      if m.group(0) == '两码' and line[m.start():m.end()+1] == '两码事':
                          continue
                      leftovers.append((p, n, line[max(0,m.start()-35):min(len(line),m.end()+50)]))
          if leftovers:
              print('\nLEFTOVERS')
              for p, n, ctx in leftovers:
                  print(f'{p}:{n}: {ctx}')
              raise SystemExit(f'Unresolved numeric-ma tokens: {len(leftovers)}')

          print('\nUNIT_AUDIT_PASS')
      - name: Commit repaired corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "统一计量、编号与时间写法"
          git push origin main
