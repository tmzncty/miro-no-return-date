name: one-time unit audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate suspicious numeric-ma tokens
        shell: python
        run: |
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          roots = [Path('chapters'), Path('canon'), Path('notes'), Path('arcs')]
          pat = re.compile(r'[零〇一二三四五六七八九十百千万两0-9点\.]+码')
          counts = Counter()
          examples = defaultdict(list)
          total = 0
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob('*.md')):
                  text = p.read_text(encoding='utf-8')
                  for n, line in enumerate(text.splitlines(), 1):
                      for m in pat.finditer(line):
                          after = line[m.end():m.end()+1]
                          if after == '头':
                              continue
                          total += 1
                          key = m.group(0) + '⟶' + line[m.end():m.end()+10]
                          counts[key] += 1
                          if len(examples[key]) < 3:
                              examples[key].append(f'{p}:{n}: {line[max(0,m.start()-25):min(len(line),m.end()+35)]}')
          for key, count in counts.most_common():
              print(f'[{count:3}] {key}')
              for ex in examples[key]:
                  print('      ' + ex)
          print(f'\nUNIQUE={len(counts)} TOTAL={total}')
