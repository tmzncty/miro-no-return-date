name: one-time unit repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit-audit-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair numeric-ma contamination
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = [
              ('第五码站', '第五站'), ('第七码站', '第七站'),
              ('原东南柱应该在道路外侧三十七码左右', '原东南柱应该在道路外侧三十七米左右'),
              ('西南八码区', '西南八号区'), ('长潮线第七码早餐车', '长潮线第七号早餐车'),
              ('三十七码长的现有系统结构说明', '三十七页的现有系统结构说明'),
              ('所以真正买回去的不是四十七码纸。', '所以真正买回去的，不只是四十七本书。'),
              ('四十七码书', '四十七本书'), ('十七码计数机', '十七号计数机'),
              ('四十七码息', '四十七息'), ('四十七码事件', '四十七本书事件'),
              ('第三批第七码', '第三批第七台'), ('第二代低成本格处理机七码样机', '第二代低成本格处理机七号样机'),
              ('十八点零七码', '十八点零七分'), ('王冠有七码高的中央饰叶', '王冠有约7厘米高的中央饰叶'),
              ('其中七码柜只有我能开', '其中七号柜只有我能开'), ('桥下七码仪表社', '桥下七号仪表社'),
              ('二十七码不同高度的窗', '二十七扇不同高度的窗'),
              ('南岸七码联合停手二十分钟', '南岸七厂联合停手二十分钟'),
              ('十二点零八码', '十二点零八分'), ('二十七码人', '二十七人'),
              ('二十七码名字', '二十七个名字'), ('二十七码家庭', '二十七个家庭'), ('二十七码。', '二十七人。'),
              ('南岸七码又恢复', '南岸七厂区又恢复'), ('南岸七码的谈判', '南岸七厂的谈判'),
              ('南岸七码那场谈判', '南岸七厂那场谈判'), ('南岸七码', '南岸七厂'),
              ('七码环线', '七号环线'), ('塔温六码公共剧场', '塔温六号公共剧场'),
              ('六码公共剧场', '六号公共剧场'), ('六码剧场', '六号剧场'),
              ('第一七码头', '第一码头'), ('第二七码头', '第二码头'),
              ('六码重建过两次，七码现在仍在用', '第六码头重建过两次，第七码头现在仍在用'),
              ('七码有灯，八码有声', '第七码头有灯，第八码头有声'),
              ('六码公共装卸区', '六号公共装卸区'), ('六码外侧泊着两艘拖船', '第六码头外侧泊着两艘拖船'),
              ('《塔温港异闻十七码》', '《塔温港异闻十七则》'), ('《异闻十七码》', '《异闻十七则》'),
              ('今日七码外又有人听见旧信号', '今日第七码头外又有人听见旧信号'),
              ('一天来回六码', '一天往返六班'), ('六点零七码', '六点零七分'),
              ('旧商埠南侧七码小客运栈桥', '旧商埠南侧七号小客运栈桥'), ('七码线', '七号线'),
              ('海门七码', '海门七号'),
              ('大约七码长——当然是这个世界的七码制，不是我胡乱量的——', '船长大约三十米，'),
              ('七码外侧吊机', '第七码头外侧吊机'), ('七码外轮候区', '七号外轮候区'), ('七码客船', '七号线客船'),
              ('同一段约七码长的港岸', '同一段约六十米长的港岸'), ('七码长的教学岸段', '六十米长的教学岸段'),
              ('水尺三点七码', '水尺3.7米'), ('第一条旧木桩外七码半', '第一条旧木桩外7.5米'),
              ('实际水边往里六码左右', '实际水边往里6米左右'), ('十二时五十七码', '十二时五十七分'),
              ('六码门架', '六号门架'), ('六码多长的旧小艇码头基础', '六米多长的旧小艇码头基础'),
              ('普通旅行证件可停留七码', '普通旅行证件可停留七天'),
              ('第二天九时八码的普通客货船', '第二天九时零八分的普通客货船'),
              ('只有八码桌的小店', '只有八张桌的小店'), ('“有一百七码。”', '“有一百零七页。”'),
              ('八码多条窄街', '八九条窄街'), ('沿台阶扛上七码高度', '沿台阶扛上几十米高差'),
              ('岬灯七码街区', '岬灯七号街区'), ('八码长的密封带', '八米长的密封带'),
              ('本周修补八码件，成衣三件', '本周修补八件，成衣三件'), ('含上楼七码以内搬运', '含七层以内搬运'),
              ('很多工坊前面只有六码宽', '很多工坊前面只有六米宽'),
              ('预计十到十七码后到', '预计十到十七天后到'), ('你已经检查七码了', '你已经检查七遍了'),
              ('没有七码。', '没有七遍。'), ('数到七码以后', '数到七以后'),
              ('看见八码、七码、旧商埠', '看见第八码头、第七码头、旧商埠'), ('桌上摆了七码张票价表', '桌上摆了七张票价表'),
              ('第三日六时四十七码', '第三日六时四十七分'), ('十七码分钟转车', '十七分钟转车'),
              ('分散在七码个包里', '分散在七个包里'), ('买了七码只不同馅的小烤饼', '买了七只不同馅的小烤饼'),
              ('弥珞那个七码烤饼方案', '弥珞那个七只小烤饼方案'),
              ('六时四十七码', '六时四十七分'), ('晚了七码钟', '晚了七分钟'), ('慢了七码钟', '慢了七分钟'),
              ('停留七码', '停留七天'), ('门内三码左右', '门内三米左右'), ('七码分钟后', '七分钟后'),
              ('晚七码钟回灰岭', '晚七分钟回灰岭'),
          ]

          skip_docs = {'canon/units.md', 'notes/unit-audit.md', 'notes/style-guide.md'}
          all_md = [p for p in Path('.').rglob('*.md') if '.git' not in p.parts]
          changed = []
          for p in all_md:
              if p.as_posix() in skip_docs:
                  continue
              text = p.read_text(encoding='utf-8')
              old = text
              for a, b in replacements:
                  text = text.replace(a, b)
              if text != old:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          old_name = Path('chapters/190-我们说只是去旧书廊看看，最后给灰岭寄回去了四十七码书.md')
          new_name = Path('chapters/190-我们说只是去旧书廊看看，最后给灰岭寄回去了四十七本书.md')
          if old_name.exists():
              old_name.rename(new_name)
              changed.append(f'{old_name} -> {new_name}')

          old_path = old_name.as_posix()
          new_path = new_name.as_posix()
          for p in [p for p in Path('.').rglob('*.md') if '.git' not in p.parts and p.as_posix() not in skip_docs]:
              text = p.read_text(encoding='utf-8')
              if old_path in text:
                  p.write_text(text.replace(old_path, new_path), encoding='utf-8')
                  if str(p) not in changed:
                      changed.append(str(p))

          print('CHANGED_FILES')
          for p in changed:
              print(p)

          pat = re.compile(r'[零〇一二三四五六七八九十百千万两0-9点\.]+码')
          leftovers = []
          for p in [p for p in Path('.').rglob('*.md') if '.git' not in p.parts and p.as_posix() not in skip_docs]:
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  for m in pat.finditer(line):
                      if line[m.end():m.end()+1] == '头':
                          continue
                      if m.group(0) == '两码' and line[m.start():m.end()+1] == '两码事':
                          continue
                      leftovers.append((p, n, line[max(0,m.start()-35):min(len(line),m.end()+50)]))
          if leftovers:
              print('\nLEFTOVERS')
              for p, n, ctx in leftovers:
                  print(f'{p}:{n}: {ctx}')
              raise SystemExit(f'Unresolved numeric-ma tokens: {len(leftovers)}')
          print('\nUNIT_AUDIT_PASS')
      - name: Commit repaired corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "统一计量、编号与时间写法"
          git push origin main
