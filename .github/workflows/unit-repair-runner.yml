name: final unit audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit-repair-runner.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan every markdown file
        shell: python
        run: |
          from pathlib import Path
          import re

          pat = re.compile(r'[零〇一二三四五六七八九十百千万两0-9点\.]+码')
          leftovers = []
          checked = 0
          for p in sorted(Path('.').rglob('*.md')):
              if '.git' in p.parts:
                  continue
              checked += 1
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  for m in pat.finditer(line):
                      # Legitimate Chinese word: 码头, including 第七码头/第八码头.
                      if line[m.end():m.end()+1] == '头':
                          continue
                      # Legitimate fixed idiom: 两码事.
                      if m.group(0) == '两码' and line[m.start():m.end()+1] == '两码事':
                          continue
                      leftovers.append((p, n, line))
          print(f'CHECKED_MARKDOWN={checked}')
          if leftovers:
              print('UNRESOLVED')
              for p, n, line in leftovers:
                  print(f'{p}:{n}: {line}')
              raise SystemExit(f'leftovers={len(leftovers)}')
          print('FULL_REPO_UNIT_AUDIT_PASS')
